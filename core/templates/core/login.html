{% extends "base.html" %}
{% block content %}
<h1 class="text-2xl font-bold mb-4">Login</h1>

<form 
    hx-post="/api/v1/login/" 
    hx-target="#login-messages" 
    hx-swap="innerHTML" 
    class="space-y-4" 
    method="POST"
>
  {% csrf_token %}
  <input type="email" name="email" placeholder="Email" class="w-full p-2 border rounded" required>
  <input type="password" name="password" placeholder="Contraseña" class="w-full p-2 border rounded" required>
  <button class="w-full bg-blue-500 text-white py-2 rounded" type="submit">Entrar</button>
</form>

<div id="login-messages" class="mt-4"></div>

{% endblock %}
