{% extends "base.html" %}
{% block content %}

<div class="w-screen min-h-screen flex items-start justify-center pt-20 pb-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full bg-white border border-blue-200 p-8 rounded-2xl shadow-2xl">
    <h2 class="text-2xl font-bold mb-6 text-center text-blue-800">🔑 Unirse a un grupo</h2>

    {% if success %}
      <div class="bg-green-100 text-green-800 px-4 py-2 rounded mb-4">{{ success }}</div>
    {% endif %}
    {% if error %}
      <div class="bg-red-100 text-red-700 px-4 py-2 rounded mb-4">{{ error }}</div>
    {% endif %}

    <form method="POST" class="space-y-4">
      {% csrf_token %}
      <input 
        type="text" 
        name="invite_code" 
        placeholder="Código de invitación" 
        class="w-full p-3 border border-gray-300 rounded-lg" 
        required
      >
      <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg transition">
        Unirse al grupo
      </button>
    </form>
  </div>
</div>

{% endblock %}
