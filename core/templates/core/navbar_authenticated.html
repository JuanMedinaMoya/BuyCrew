<nav id="navbar" class="bg-white shadow px-6 py-4 flex justify-between items-center">
    <a href="/" class="text-xl font-bold text-blue-600 hover:underline">BuyCrew</a>
    <div class="flex items-center space-x-4">
        <span class="text-gray-700">Hola, {{ user.name }}</span>
        <form 
            hx-post="/api/v1/logout/" 
            hx-swap="none"
            hx-on::after-request="htmx.ajax('GET', '/api/v1/user/', { target: '#navbar', swap: 'outerHTML' })"
        >
            <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">
            <button class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded">
                Logout
            </button>
        </form>
    </div>
</nav>
