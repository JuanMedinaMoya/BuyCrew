{% extends "base.html" %}
{% block content %}
<h2 class="text-2xl font-semibold mb-4">Crear Producto</h2>

<form 
  id="product-form"
  hx-post="/api/v1/product/" 
  hx-target="#form-response" 
  hx-swap="innerHTML" 
  class="space-y-4" 
  method="POST"
>
  {% csrf_token %}

  <input type="text" name="name" placeholder="Nombre del producto" class="w-full p-2 border rounded" required>
  <input type="number" step="0.01" name="price" placeholder="Precio" class="w-full p-2 border rounded" required>
  <input type="number" name="stock" placeholder="Stock disponible" class="w-full p-2 border rounded" required>

  <input type="number" step="0.1" name="ratio_consumo" placeholder="Ratio de consumo (por persona/día)" class="w-full p-2 border rounded" required>

  <label class="block font-medium mb-2">Categorías:</label>
  <div class="flex space-x-4">
    <select id="availableCategories" multiple class="w-1/2 p-2 border rounded h-48">
      {% for category in category_list %}
        <option value="{{ category.name }}">{{ category.name }}</option>
      {% endfor %}
    </select>
  
    <div class="flex flex-col justify-center space-y-2">
      <button type="button" onclick="moveSelected('availableCategories', 'selectedCategories')" class="bg-blue-500 hover:bg-blue-600 text-white px-2 py-1 rounded">→</button>
      <button type="button" onclick="moveSelected('selectedCategories', 'availableCategories')" class="bg-blue-500 hover:bg-blue-600 text-white px-2 py-1 rounded">←</button>
    </div>
  
    <select id="selectedCategories" name="categories" multiple  class="w-1/2 p-2 border rounded h-48"></select>
  </div>  

  <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded">Guardar</button>

</form>

<div id="form-response" class="mt-4"></div>
<script>
    function moveSelected(fromId, toId) {
      const from = document.getElementById(fromId);
      const to = document.getElementById(toId);
  
      const selectedOptions = Array.from(from.selectedOptions);
      selectedOptions.forEach(option => {
        const newOption = new Option(option.text, option.value);
        to.add(newOption);
        from.remove(option.index);
      });
      sortSelectOptions(to);
    }
    function sortSelectOptions(selectElement) {
        const options = Array.from(selectElement.options);
        options.sort((a, b) => a.text.localeCompare(b.text));
        selectElement.innerHTML = '';
        options.forEach(opt => selectElement.add(opt));
    }

    document.getElementById('product-form').addEventListener('submit', function (e) {
      const selected = document.getElementById('selectedCategories');
      const selectedOptions = Array.from(selected.options);
      
      if (selectedOptions.length === 0) {
        alert("Debes seleccionar al menos una categoría.");
        e.preventDefault();
        return;
      }
  
      selectedOptions.forEach(option => option.selected = true);
    });
  
</script>
{% endblock %}
