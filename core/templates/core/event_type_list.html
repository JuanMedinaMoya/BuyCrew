{# event_type_list.html #}
{% extends "base.html" %}
{% block content %}
<h2 class="text-2xl font-semibold mb-4">Tipos de Evento</h2>
<ul class="list-disc pl-6 space-y-2">
  {% for item in items %}
    <li>
      <a href="{% url 'event_type_detail' item.name %}" class="text-blue-600 hover:underline">{{ item.name }}</a>
    </li>
  {% empty %}
    <li class="text-gray-500">No hay tipos de evento registrados.</li>
  {% endfor %}
</ul>
{% endblock %}
