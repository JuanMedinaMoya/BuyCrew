{# group_list.html #}
{% extends "base.html" %}
{% block content %}
<h2 class="text-2xl font-semibold mb-4">Grupos</h2>
<ul class="bg-white rounded shadow divide-y divide-gray-200">
  {% for item in items %}
    <li class="p-4 hover:bg-gray-50">
      <a href="{% url 'group_detail' item.pk %}" class="text-blue-600 hover:underline">{{ item.name }}</a>
    </li>
  {% empty %}
    <li class="p-4 text-gray-500">No perteneces a ningun grupo.</li>
  {% endfor %}
</ul>
{% endblock %}
