{% extends "base.html" %}
{% load custom_filters %}
{% block content %}
<div class="max-w-3xl mx-auto bg-white p-6 rounded shadow mt-10">
  <h2 class="text-2xl font-bold mb-4">Añadir productos al carrito de {{ cart.group.name }}</h2>

  <form method="POST" class="space-y-4">
    {% csrf_token %}
    {% for product in products %}
      <div class="flex justify-between items-center border-b pb-2">
        <span>{{ product.name }}</span>
        <input type="number" name="product_{{ product.id }}" value="{{ cart_items|get_item:product.id|default_if_none:0 }}" min="0" class="w-20 p-1 border rounded">
      </div>
    {% empty %}
      <p>No hay productos disponibles.</p>
    {% endfor %}
    <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 mt-4"> Guardar cambios</button>
  </form>
</div>
{% endblock %}
