{# event_type_detail.html #}
{% extends "base.html" %}
{% block content %}
<h2 class="text-2xl font-bold mb-4">{{ event.name }}</h2>
<p class="text-gray-700">{{ event.description }}</p>
<ul class="mt-4 text-gray-600">
  <li><strong>Alcohol:</strong> {{ event.alcoholic|yesno:"Sí,No" }}</li>
  <li><strong>Cerveza:</strong> {{ event.beer_friendly|yesno:"Sí,No" }}</li>
</ul>
{% if user.is_staff %}
  <div class="mt-6 space-x-2">
    <a href="{% url 'event_type_edit' event.name %}" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">✏️ Editar</a>
    <form action="{% url 'event_type_delete' event.name %}" method="POST" class="inline" onsubmit="return confirm('¿Eliminar tipo de evento?');">
      {% csrf_token %}
      <button type="submit" class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700">️ Borrar</button>
    </form>
  </div>
{% endif %}
{% endblock %}
