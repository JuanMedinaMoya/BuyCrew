{% extends "base.html" %}
{% block content %}
<h2 class="text-2xl font-semibold mb-4">Lista de Products</h2>
<ul class="bg-white rounded shadow divide-y divide-gray-200">
  {% for item in items %}
    <li class="p-4">{{ item }}</li>
  {% empty %}
    <li class="p-4 text-gray-500">No hay products registrados.</li>
  {% endfor %}
</ul>
{% endblock %}
