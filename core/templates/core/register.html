{% extends "base.html" %}
{% block content %}

<div class="w-screen min-h-screen flex items-start justify-center pt-20 pb-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full bg-white border border-blue-200 p-8 rounded-2xl shadow-2xl">
    <h1 class="text-2xl font-bold mb-6 text-center text-blue-800">Crear cuenta en BuyCrew</h1>

    <form 
      hx-post="/api/v1/register/" 
      hx-target="#register-messages" 
      hx-swap="innerHTML" 
      method="POST"
      hx-on::after-request="if(event.detail.xhr.status === 400) htmx.process(document.body);" 
      class="space-y-4"
    >
      {% csrf_token %}

      <input 
        type="email" 
        name="email" 
        placeholder="Correo electrónico" 
        required 
        class="w-full p-3 border border-gray-300 rounded-lg"
      >

      <input 
        type="text" 
        name="name" 
        placeholder="Nombre completo" 
        required 
        class="w-full p-3 border border-gray-300 rounded-lg"
      >

      <input 
        type="password" 
        name="password" 
        placeholder="Contraseña" 
        required 
        class="w-full p-3 border border-gray-300 rounded-lg"
      >

      <button 
        type="submit" 
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg transition"
      >
        Registrarse
      </button>
    </form>

    <div id="register-messages" class="mt-4"></div>

    <p class="text-center text-sm text-gray-500 mt-6">
      ¿Ya tienes cuenta? 
      <a href="/login/" class="text-blue-600 hover:underline font-medium">Inicia sesión</a>
    </p>
  </div>
</div>

{% endblock %}
