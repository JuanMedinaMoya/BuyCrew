{% extends "base.html" %}
{% block content %}

<div class="w-screen h-screen flex items-center justify-center bg-gray-50">
  <div class="max-w-md w-full bg-white p-8 rounded-xl shadow-md">
    <h1 class="text-2xl font-bold mb-6 text-center text-gray-800">Crear cuenta en BuyCrew</h1>

    <form 
      hx-post="/api/v1/register/" 
      hx-target="#register-messages" 
      hx-swap="innerHTML" 
      method="POST"
      class="space-y-4"
    >
      {% csrf_token %}

      <input 
        type="email" 
        name="email" 
        placeholder="Correo electrónico" 
        required 
        class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
      >

      <input 
        type="text" 
        name="name" 
        placeholder="Nombre completo" 
        required 
        class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
      >

      <input 
        type="password" 
        name="password" 
        placeholder="Contraseña" 
        required 
        class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
      >

      <button 
        type="submit" 
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg transition"
      >
        Registrarse
      </button>
    </form>

    <div id="register-messages" class="mt-4"></div>

    <p class="text-center text-sm text-gray-500 mt-6">
      ¿Ya tienes cuenta? 
      <a href="/login/" class="text-blue-600 hover:underline font-medium">Inicia sesión</a>
    </p>
  </div>
</div>

{% endblock %}
