<ul class="bg-white rounded shadow divide-y divide-gray-200">
    {% for category in items %}
      <li class="p-4 flex justify-between items-center hover:bg-gray-50 transition">
        <a href="{% url 'category_detail' category.name %}" class="text-blue-700 font-semibold">{{ category.name }}</a>
        {% if user.is_staff %}
          <div class="space-x-2 text-sm">
            <a href="{% url 'category_edit' category.name %}" class="text-blue-600 hover:underline">✏️ Editar</a>
            <form action="{% url 'category_delete' category.name %}" method="POST" class="inline" onsubmit="return confirm('¿Eliminar esta categoría?');">
              {% csrf_token %}
              <button type="submit" class="text-red-600 hover:underline">🗑️ Eliminar</button>
            </form>
          </div>
        {% endif %}
      </li>
    {% empty %}
      <li class="p-4 text-gray-500 text-center">No hay categorías registradas.</li>
    {% endfor %}
  </ul>
