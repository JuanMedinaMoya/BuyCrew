{% extends "base.html" %}
{% block content %}

<div class="flex justify-between items-center mb-6">
  <h2 class="text-2xl font-bold text-blue-800"> Órdenes</h2>
</div>

<div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
  <input 
    type="text"
    name="search"
    placeholder=" Buscar por grupo o dirección..."
    value="{{ request.GET.search }}"
    class="w-full p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
    hx-get="{% url 'order_list_admin' %}"
    hx-trigger="keyup changed delay:300ms"
    hx-target="#order-list-container"
    hx-include="[name='search']"
  >
</div>

<div class="overflow-x-auto bg-white shadow rounded-lg">
  <table class="min-w-full divide-y divide-gray-200 text-sm">
    <thead class="bg-gray-50 text-gray-700 font-semibold">
      <tr>
        <th class="px-6 py-3 text-left">Grupo</th>
        <th class="px-6 py-3 text-left">Creador</th>
        <th class="px-6 py-3 text-left">Fecha</th>
        <th class="px-6 py-3 text-left">Precio total</th>
        <th class="px-6 py-3 text-left">Dirección</th>
        <th class="px-6 py-3 text-left">Confirmada</th>
      </tr>
    </thead>
    <tbody id="order-list-container">
      {% include "core/parts/order_table_fragment.html" %}
    </tbody>
  </table>
</div>

{% endblock %}
